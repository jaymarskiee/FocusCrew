<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – The Focus Crew</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { background: #0f0f0f; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .reset-card {
      background: #1a1a1a; border-radius: 16px; padding: 48px 40px;
      max-width: 420px; width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,.6);
    }
    .reset-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: #fff; letter-spacing: 3px; margin-bottom: 8px; }
    .reset-logo span { color: #F5A623; }
    h2 { font-size: 1.3rem; font-weight: 800; color: #fff; margin: 24px 0 6px; text-transform: uppercase; letter-spacing: 1px; }
    h2 span { color: #F5A623; }
    .subtitle { color: #888; font-size: .85rem; margin-bottom: 28px; }
    .msg-success { background:#1a3a2a; border:1px solid #2ecc71; color:#2ecc71; padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:.875rem; display:none; }
    .msg-error   { background:#3a1a1a; border:1px solid #e74c3c; color:#e74c3c; padding:12px 16px; border-radius:8px; margin-bottom:16px; font-size:.875rem; display:none; }
    .eye-btn {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; font-size: 1.1rem;
      color: #aaa; padding: 0; line-height: 1;
    }
    .eye-btn:hover { color: #F5A623; }
    a.back { color: #aaa; font-size: .85rem; display: block; text-align: center; margin-top: 24px; }
    a.back:hover { color: #F5A623; }
  </style>
</head>
<body>

<div class="reset-card">
  <div class="reset-logo">THE <span>FOCUS</span> CREW</div>
  <h2>RESET <span>PASSWORD</span></h2>
  <p class="subtitle">Enter your new password below.</p>

  <div id="msg-success" class="msg-success"></div>
  <div id="msg-error"   class="msg-error"></div>

  <div id="reset-form-wrap">
    <div class="input-group">
      <label for="new-password">New Password</label>
      <span class="input-icon">🔒</span>
      <input type="password" id="new-password" placeholder="Min. 6 characters" />
      <button type="button" class="eye-btn" onclick="toggleEye('new-password', this)" title="Show/hide password">👁</button>
    </div>
    <div class="input-group">
      <label for="confirm-password">Confirm Password</label>
      <span class="input-icon">🔒</span>
      <input type="password" id="confirm-password" placeholder="Repeat new password" />
      <button type="button" class="eye-btn" onclick="toggleEye('confirm-password', this)" title="Show/hide password">👁</button>
    </div>
    <button id="reset-btn" class="btn btn-primary" style="width:100%;justify-content:center;">
      Set New Password
    </button>
  </div>

  <a href="login.html" class="back">← Back to Login</a>
</div>

<script src="js/main.js"></script>
<script>
  function toggleEye(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🙈';
    } else {
      input.type = 'password';
      btn.textContent = '👁';
    }
  }

  // Get token from URL
  const token = new URLSearchParams(window.location.search).get('token');

  if (!token) {
    document.getElementById('msg-error').textContent = '❌ Invalid or missing reset link. Please request a new one.';
    document.getElementById('msg-error').style.display = 'block';
    document.getElementById('reset-form-wrap').style.display = 'none';
  }

  document.getElementById('reset-btn').addEventListener('click', async function () {
    const newPass = document.getElementById('new-password').value.trim();
    const confPass = document.getElementById('confirm-password').value.trim();
    const errEl = document.getElementById('msg-error');
    const sucEl = document.getElementById('msg-success');

    errEl.style.display = 'none';
    sucEl.style.display = 'none';

    if (!newPass || !confPass) {
      errEl.textContent = '⚠ Please fill in both fields.';
      errEl.style.display = 'block'; return;
    }
    if (newPass.length < 6) {
      errEl.textContent = '⚠ Password must be at least 6 characters.';
      errEl.style.display = 'block'; return;
    }
    if (newPass !== confPass) {
      errEl.textContent = '⚠ Passwords do not match.';
      errEl.style.display = 'block'; return;
    }

    this.disabled = true;
    this.innerHTML = '<span class="spinner"></span> Saving...';

    const res = await fetch('api/users.php?action=reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: newPass }),
    });
    const data = await res.json();

    this.disabled = false;
    this.textContent = 'Set New Password';

    if (data.success) {
      sucEl.textContent = '✅ ' + data.message;
      sucEl.style.display = 'block';
      document.getElementById('reset-form-wrap').style.display = 'none';
      setTimeout(() => window.location.href = 'login.html', 2500);
    } else {
      errEl.textContent = '❌ ' + (data.error || 'Something went wrong. Please try again.');
      errEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
